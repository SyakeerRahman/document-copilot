[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openai==3.10.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-ai==2.42.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs live OpenAI / Supabase credentials"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 120
# Migrations keep Alembic's generated style so reviewed diffs stay readable.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make isort treat the package as first-party.
known-third-party = ["alembic"]
